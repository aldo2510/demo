name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Verify
        run: mvn -B -ntp clean verify

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: java25-api
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
