name: Security Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [exercise/false-positive-management]

permissions:
  contents: read

jobs:
  security-gate:
    name: SAST + Severity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run SAST
        run: |
          semgrep --config security/semgrep.yml --json --output semgrep.json

      - name: Evaluate severity policy and false-positive exceptions
        run: python security/gate.py semgrep.json

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: error
