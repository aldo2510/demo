name: Dynatrace Pipeline Observability - POC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dynatrace-observability

permissions:
  contents: read

jobs:
  build-test-observability:
    name: Build and test pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven verification
        run: mvn -B -ntp clean verify
