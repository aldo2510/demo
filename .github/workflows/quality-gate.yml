name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, tests, Checkstyle and JaCoCo
        run: mvn -B -ntp clean verify

      - name: Enforce coverage gate
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          report = Path('target/site/jacoco/index.html')
          if not report.exists():
              raise SystemExit('JaCoCo report not found')
          html = report.read_text(encoding='utf-8')
          match = re.search(r'<tfoot>.*?<td class="ctr2">(\d+)%</td>', html, re.S)
          if not match:
              raise SystemExit('Could not determine JaCoCo instruction coverage')
          coverage = int(match.group(1))
          minimum = 80
          print(f'Instruction coverage: {coverage}% (minimum: {minimum}%)')
          if coverage < minimum:
              raise SystemExit('QUALITY GATE FAILED: coverage below threshold')
          print('QUALITY GATE PASSED: coverage threshold met')
          PY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build for CodeQL
        run: mvn -B -ntp -DskipTests package

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java

  dependency-review:
    name: Dependency Security Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  gate:
    name: Final Quality Gate
    if: always()
    needs: [quality, codeql, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gates
        shell: bash
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "codeql=${{ needs.codeql.result }}"
          echo "dependency-review=${{ needs.dependency-review.result }}"
          if [[ "${{ needs.quality.result }}" != "success" || "${{ needs.codeql.result }}" != "success" || ("${{ github.event_name }}" == "pull_request" && "${{ needs.dependency-review.result }}" != "success") ]]; then
            echo 'QUALITY GATE FAILED'
            exit 1
          fi
          echo 'QUALITY GATE PASSED'
