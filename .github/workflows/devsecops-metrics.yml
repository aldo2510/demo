name: DevSecOps Metrics Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'metrics/**'
      - '.github/workflows/devsecops-metrics.yml'

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate metrics readout
        run: python metrics/devsecops_metrics.py | tee devsecops-metrics-report.txt

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-metrics-report
          path: devsecops-metrics-report.txt
