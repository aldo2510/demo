name: DevSecOps Metrics Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'metrics/**'
      - '.github/workflows/devsecops-metrics.yml'

permissions:
  contents: read
  security-events: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate metrics readout
        run: python metrics/devsecops_metrics.py | tee devsecops-metrics-report.txt

      - name: Generate SARIF security results
        run: python metrics/generate_sarif.py

      - name: Show SARIF summary
        run: |
          echo '### SARIF security results' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Rule | Level | Severity | Category |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('devsecops-results.sarif', encoding='utf-8') as f:
              sarif = json.load(f)
          rules = {r['id']: r for r in sarif['runs'][0]['tool']['driver']['rules']}
          for result in sarif['runs'][0]['results']:
              rule = rules[result['ruleId']]
              props = result.get('properties', {})
              print(f"| {result['ruleId']} | {result['level']} | {props.get('severity', '-')} | {props.get('category', '-')} |")
          PY

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devsecops-results.sarif
          category: devsecops-metrics-lab

      - name: Publish reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-metrics-report
          path: |
            devsecops-metrics-report.txt
            devsecops-results.sarif
