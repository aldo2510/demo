name: DevSecOps Metrics Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'metrics/**'
      - '.github/workflows/devsecops-metrics.yml'

permissions:
  contents: read
  security-events: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate metrics readout
        run: python metrics/devsecops_metrics.py | tee devsecops-metrics-report.txt

      - name: Generate SARIF security results
        run: python metrics/generate_sarif.py

      - name: Build executive dashboard
        run: python metrics/generate_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devsecops-results.sarif
          category: devsecops-metrics-lab

      - name: Publish reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-metrics-report
          path: |
            devsecops-metrics-report.txt
            devsecops-results.sarif
