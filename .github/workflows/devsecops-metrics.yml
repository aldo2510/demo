name: DevSecOps Metrics Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'metrics/**'
      - '.github/workflows/devsecops-metrics.yml'

permissions:
  contents: read
  security-events: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate metrics readout
        run: python metrics/devsecops_metrics.py | tee devsecops-metrics-report.txt

      - name: Generate SARIF security results
        run: python metrics/generate_sarif.py

      - name: Publish complete lab summary
        run: |
          {
            echo '# DevSecOps Metrics Lab'
            echo ''
            echo '## 1. Complete metrics readout'
            echo ''
            echo '```text'
            cat devsecops-metrics-report.txt
            echo '```'
            echo ''
            echo '## 2. SARIF findings'
            echo ''
            echo '| Rule | Level | Severity | Category | Location | Message |'
            echo '|---|---|---|---|---|---|'
            python - <<'PY'
          import json
          from pathlib import Path
          sarif = json.loads(Path('devsecops-results.sarif').read_text(encoding='utf-8'))
          run = sarif['runs'][0]
          rules = {r['id']: r for r in run['tool']['driver']['rules']}
          for result in run['results']:
              rule_id = result['ruleId']
              rule = rules.get(rule_id, {})
              props = result.get('properties', {})
              loc = result.get('locations', [{}])[0].get('physicalLocation', {})
              artifact = loc.get('artifactLocation', {}).get('uri', '-')
              line = loc.get('region', {}).get('startLine', '-')
              message = result.get('message', {}).get('text', rule.get('shortDescription', {}).get('text', '-'))
              message = message.replace('|', '\\|').replace('\n', ' ')
              print(f"| {rule_id} | {result.get('level', '-')} | {props.get('severity', '-')} | {props.get('category', '-')} | `{artifact}:{line}` | {message} |")
          PY
            echo ''
            echo '## 3. SARIF artifact'
            echo ''
            echo 'The raw SARIF file is also uploaded as a workflow artifact and published to GitHub Code Scanning.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devsecops-results.sarif
          category: devsecops-metrics-lab

      - name: Publish reports
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-metrics-report
          path: |
            devsecops-metrics-report.txt
            devsecops-results.sarif
